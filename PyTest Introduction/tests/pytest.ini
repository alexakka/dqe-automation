[pytest]
# marks
markers =
    validate_csv: tests that vpipalidate the content/structure of the CSV file
    unmarked: automatically assigned to all tests with no mark

# python_files
python_files = test_*.py

# addopts
addopts = -v --html=reports/report.html

env_files =.env
rp_endpoint = http://localhost:8080/api/v1
rp_api_key = b5f2c135-xxxx-xxxx-xxxx-c6a3c0d6fabf
rp_launch = My_First_Launch
rp_project = my_auto_project
rp_enable = True
rp_log_batch_size = 20