[pytest]
python_files = test_*.py
addopts = --strict-markers -ra
markers =
    parquet_data: data quality checks of the aggregated parquet datasets (production DQ run filter)
    smoke: fast availability check, not-empty dataset
    example: sample tests from test_examples.py, never part of the DQ run
    facility_name_min_time_spent_per_visit_date: checks for this parquet dataset
    facility_type_avg_time_spent_per_visit_date: checks for this parquet dataset
    patient_sum_treatment_cost_per_facility_type: checks for this parquet dataset
